name = "dnsdash"
main = "src/index.js"
compatibility_date = "2026-08-01"
workers_dev = true

[vars]
UPSTREAM_DOH = "https://cloudflare-dns.com/dns-query"
UPSTREAM_DOH_FALLBACKS = "https://dns.google/dns-query,https://dns.quad9.net/dns-query"
DNS_TIMEOUT_MS = "6000"
DNSDASH_BLOCKING = "1"
DNSDASH_BLOCK_MODE = "nxdomain"
DNSDASH_RETENTION_DAYS = "7"

# Optional persistent Pi-hole features:
# Bind a Workers KV namespace in Cloudflare with binding name DNSDASH_KV.
# Bind a D1 database in Cloudflare with binding name DNSDASH_DB.
# Add DNSDASH_ADMIN_TOKEN as an encrypted Worker secret, not a plaintext var.
# Optional privacy-preserving client labels require DNSDASH_LOG_SALT as a secret.

[triggers]
crons = ["17 3 * * *"]
