name: Probe DNS Dash Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for DNS Dash 3 production build
        shell: bash
        run: |
          set -uo pipefail
          url='https://dnsdash.huggy.bond/'
          ready=0
          for attempt in $(seq 1 24); do
            echo "production probe attempt $attempt"
            if curl -fsS --max-time 15 -D /tmp/prod-headers "$url" -o /tmp/prod-home.html; then
              echo '--- page markers ---'
              grep -Eo 'Manage firewall|Blocking enabled|DNS Dash 3\.0|Checking resolver' /tmp/prod-home.html | head -n 10 || true
              if grep -Fq 'Manage firewall' /tmp/prod-home.html && grep -Fq 'DNS Dash 3.0' /tmp/prod-home.html; then
                ready=1
                break
              fi
            fi
            sleep 5
          done
          if [ "$ready" != '1' ]; then
            echo 'Production did not expose the DNS Dash 3 firewall dashboard.'
            cat /tmp/prod-headers 2>/dev/null || true
            sed -n '1,100p' /tmp/prod-home.html 2>/dev/null || true
            exit 1
          fi

      - name: Probe production routes
        shell: bash
        run: |
          set -euxo pipefail
          curl -fsS --max-time 20 'https://dnsdash.huggy.bond/health' -o /tmp/health.json
          cat /tmp/health.json
          grep -Fq '"ok":true' /tmp/health.json
          grep -Fq '"version":"3.0.0"' /tmp/health.json
          grep -Fq '"dns-firewall"' /tmp/health.json

          curl -fsS --max-time 20 'https://dnsdash.huggy.bond/doh.txt' -o /tmp/doh.txt
          grep -Fq 'https://dnsdash.huggy.bond/dns-query' /tmp/doh.txt

          curl -fsS --max-time 20 'https://dnsdash.huggy.bond/admin' -o /tmp/admin.html
          grep -Eq 'Admin login|Blocklist subscriptions|DNSDASH_ADMIN_TOKEN' /tmp/admin.html

          curl -fsS --max-time 30 'https://dnsdash.huggy.bond/inspect?run=1&mode=record&name=example.com&type=A' -o /tmp/result.html
          grep -Fq 'Server rendered' /tmp/result.html
          grep -Fq 'example.com' /tmp/result.html
          echo 'Production DNS Dash 3 probe passed.'
